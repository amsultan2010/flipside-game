<title>Flipside</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
/* A quiet diorama: one floating ribbon in a soft gradient, very little chrome. Text is small and spaced out,
   buttons are thin outlines on frosted white. Colours come from the current chapter (set on :root by script). */
:root{
  --bg1:#ffe3d3; --bg2:#ffc6c0; --ink:#4a4360; --ink-2:#857d9c; --acc:#ff7a6b; --soft:rgba(255,255,255,.55);
  --f-serif:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-sans:"Quicksand","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-sans);background:var(--bg2);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
.bg{position:fixed;inset:0;transition:opacity 1.2s ease}
#bgA,#bgB{background:radial-gradient(ellipse 85% 55% at 50% 44%,rgba(255,255,255,.5),rgba(255,255,255,0) 70%),linear-gradient(180deg,var(--a1),var(--a2))}
/* chapter card: shown when you arrive in a new chapter */
#card{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12vh);z-index:20;text-align:center;pointer-events:none}
#card>*{opacity:0;transform:translateY(10px);transition:opacity .9s,transform 1.1s cubic-bezier(.2,.7,.2,1)}
#card.on>*{opacity:1;transform:none}
#card.on .nm{transition-delay:.2s}#card.on .bl{transition-delay:.55s}
#card .k{color:var(--ink-2)}
#card .nm{margin-top:8px;font-family:var(--f-serif);font-style:italic;font-weight:300;font-size:58px;line-height:1}
#card .rule{display:block;width:0;height:1px;margin:16px auto 12px;background:var(--ink);opacity:0;transition:width 1.3s cubic-bezier(.2,.7,.2,1) .35s,opacity .6s .35s}
#card.on .rule{width:64px;opacity:.25;transform:none}
#card .bl{font-family:var(--f-serif);font-style:italic;font-size:18px;color:var(--ink-2)}
.card-on .lvl{opacity:0}
.lvl{transition:opacity .6s}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:999px}
.caps{font-family:var(--f-sans);font-weight:600;font-size:12px;letter-spacing:.28em;text-transform:uppercase}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s}
#hud.on{opacity:1}
.ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),0 2px 10px rgba(70,50,90,.04);pointer-events:auto;transition:transform .2s,background .2s}
.ic:hover{background:rgba(255,255,255,.6)}
.ic svg *{stroke-width:1.6}
.ic:active{transform:scale(.92)}
.ic svg{width:20px;height:20px}
.ic[disabled]{opacity:.35;pointer-events:none}
.tl{position:absolute;left:max(18px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 18px);display:flex;gap:10px}
.tr{position:absolute;right:calc(max(18px,env(safe-area-inset-right,0px)) + 56px);top:calc(env(safe-area-inset-top,0px) + 18px);display:flex;gap:10px}
.lvl{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 20px);transform:translateX(-50%);text-align:center;white-space:nowrap}
.lvl .t{font-family:var(--f-serif);font-weight:400;font-size:22px;letter-spacing:.02em}
.lvl .t i{font-style:italic;font-weight:300}
.lvl .s{margin-top:4px;color:var(--ink-2)}
#bottom{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);display:flex;align-items:center;gap:14px;white-space:nowrap}
#moves{color:var(--ink-2)}
#moves b{color:var(--ink);font-weight:700}
#bHint{pointer-events:auto;display:flex;align-items:center;gap:8px;height:38px;padding:0 16px 0 12px;border-radius:999px;background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),0 2px 10px rgba(70,50,90,.04);font-family:var(--f-sans);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);transition:transform .2s,background .2s}
#bHint:hover{background:rgba(255,255,255,.6)}
#bHint:active{transform:scale(.95)}
#bHint svg{width:18px;height:18px}
#bHint small{font-size:11px;letter-spacing:.06em;color:var(--acc);font-weight:700}
#bHint[disabled]{opacity:.4;pointer-events:none}
#moves b{color:var(--ink);font-weight:700}
#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translate(-50%,8px);width:min(460px,calc(100vw - 40px));text-align:center;
  font-family:var(--f-serif);font-style:italic;font-weight:300;font-size:18px;line-height:1.45;opacity:0;transition:opacity .8s,transform .8s}
#hint.on{opacity:1;transform:translate(-50%,0)}

/* screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));
  opacity:0;transition:opacity .6s;pointer-events:none}
.screen.on{opacity:1;pointer-events:auto}
.logo{margin:0;font-family:var(--f-serif);font-weight:300;font-size:clamp(64px,12vw,132px);line-height:1;letter-spacing:-.01em}
.logo i{font-style:italic}
.tag{margin:18px 0 52px;color:var(--ink-2)}
.tbtn{display:block;margin:8px auto;padding:12px 34px;font-family:var(--f-serif);font-size:22px;font-weight:400;border-radius:999px;transition:background .25s,transform .2s}
.tbtn:hover{background:var(--soft)}
.tbtn.main{background:var(--soft);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 6px 26px rgba(70,50,90,.08)}
.tbtn:active{transform:scale(.97)}
#title .foot{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:0;right:0;color:var(--ink-2)}
#title .foot a{color:inherit;text-decoration:none}
#title{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 8vh)}
#title .menu{margin-top:auto;margin-bottom:9vh}
/* level select */
#levels{justify-content:flex-start;overflow-y:auto;padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
#levels h2{margin:0 0 30px;font-family:var(--f-serif);font-weight:300;font-size:40px}
.chap{width:min(560px,100%);display:flex;align-items:center;gap:18px;padding:16px 20px;margin-bottom:12px;border-radius:26px;background:var(--soft);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);text-align:left}
.chap .n{flex:none;width:54px;height:60px}
.chap .nm b i{font-style:normal;color:var(--ink-2);font-size:16px;margin-right:6px}
.chap .nm{flex:1;min-width:0}
.chap .nm b{display:block;font-family:var(--f-serif);font-weight:400;font-size:22px}
.chap .nm span{color:var(--ink-2)}
.dots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--c);color:var(--c);background:rgba(255,255,255,.6);transition:transform .15s}
.dot:hover:not([disabled]){transform:scale(1.12)}
.dot.done{background:var(--c);color:#fff;box-shadow:none}
.dot.perfect{box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 0 4.5px var(--c)}
.dot.next{animation:breathe 1.8s ease-in-out infinite}
.dot[disabled]{opacity:.35;cursor:default}
@keyframes breathe{50%{transform:scale(1.14)}}
#levels .back{position:absolute;left:max(18px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 18px)}
/* solved: the little world keeps turning; words float above it, one button below */
#solved{justify-content:space-between;padding-top:calc(env(safe-area-inset-top,0px) + 84px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 34px);
  background:radial-gradient(ellipse 70% 55% at 50% 50%,transparent 40%,rgba(255,255,255,.3))}
#solved .top>*,#solved .bot>*{opacity:0;transform:translateY(14px);transition:opacity .9s,transform 1s cubic-bezier(.2,.7,.2,1)}
#solved.on .top>*,#solved.on .bot>*{opacity:1;transform:none}
#solved.on .lab{transition-delay:.1s}#solved.on h3{transition-delay:.25s}#solved.on .r{transition-delay:.6s}#solved.on .nx{transition-delay:.9s}#solved.on .row{transition-delay:1.05s}
#solved .lab{color:var(--ink-2)}
#solved h3{margin:6px 0 0;font-family:var(--f-serif);font-style:italic;font-weight:300;font-size:56px;line-height:1.05}
#solved .rule{display:block;width:0;height:1px;margin:14px auto 12px;background:var(--ink);opacity:0;transition:width 1.2s cubic-bezier(.2,.7,.2,1) .4s,opacity .6s .4s}
#solved.on .rule{width:72px;opacity:.25}
#solved .r{color:var(--ink-2)}
#solved .r .p{display:inline-block;margin-left:8px;padding:4px 10px;border-radius:999px;background:var(--acc);color:#fff;letter-spacing:.2em}
#solved .nx{margin-bottom:16px;font-family:var(--f-serif);font-size:17px;color:var(--ink-2);line-height:1.5}
#solved .nx b{font-weight:400;color:var(--ink)}
#solved .nx:empty{display:none}
#solved .row{gap:16px}
@media (max-height:500px) and (orientation:landscape){
  #solved{flex-direction:row;align-items:flex-end;padding-top:24px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
  #solved .top{text-align:left}#solved .rule{margin-left:0}#solved .bot{text-align:right}#solved .row{justify-content:flex-end}
  #solved h3{font-size:40px}
}
/* sound: always in the top-right corner, opens a little card with two sliders */
#vol{position:fixed;z-index:30;right:max(18px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 18px)}
#vol .ic svg path{transition:opacity .2s}
#volCard{position:absolute;right:0;top:58px;width:232px;padding:14px 18px 10px;border-radius:24px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 10px 36px rgba(70,50,90,.14),inset 0 0 0 1px rgba(255,255,255,.8);opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .22s,transform .22s;text-align:left}
#vol.open #volCard{opacity:1;transform:none;pointer-events:auto}
#volCard .vh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;color:var(--ink-2)}
#bMute{padding:6px 10px;margin-right:-10px;border-radius:999px;color:var(--acc);letter-spacing:.18em}
#bMute:active{transform:scale(.95)}
#volCard .vr{display:block;padding:6px 0}
#volCard .vr span{display:block;font-size:10.5px;color:var(--ink-2);margin-bottom:2px}
#volCard input{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin:0;background:transparent;touch-action:none;--p:50%}
#volCard input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc) var(--p),rgba(74,67,96,.13) var(--p))}
#volCard input::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc) var(--p),rgba(74,67,96,.13) var(--p))}
#volCard input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(40,30,70,.25),inset 0 0 0 1px rgba(0,0,0,.04)}
#volCard input::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(40,30,70,.25)}
#vol.muted #volCard input{opacity:.4}
.row{display:flex;gap:14px;align-items:center;justify-content:center}
.pill{height:54px;padding:0 30px;border-radius:999px;display:flex;align-items:center;gap:10px;font-family:var(--f-serif);font-size:20px;background:#fff;box-shadow:0 8px 30px rgba(70,50,90,.12);transition:transform .2s}
.pill:active{transform:scale(.96)}
.pill svg{width:18px;height:18px}
#fade{position:fixed;inset:0;background:var(--bg1);opacity:1;transition:opacity .9s;pointer-events:none;z-index:50}
#fade.off{opacity:0}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:17px;line-height:1.6}
/* touch: a thumb pad whose arrows point the way the ball will actually roll on screen */
#pad{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 66px);width:164px;height:164px;margin-left:-82px;border-radius:50%;display:none;pointer-events:auto;
  background:radial-gradient(circle,rgba(255,255,255,.4) 0 30%,rgba(255,255,255,.18) 31% 100%);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),inset 0 0 0 26px rgba(255,255,255,.06);transition:opacity .35s;touch-action:none}
.touch #pad{display:block}
#pad.off{opacity:0;pointer-events:none}
#pad .core{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#4b4170;box-shadow:0 2px 6px rgba(40,30,70,.25)}
#pad button{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:opacity .2s,color .2s}
#pad button svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .12s}
#pad button:active svg{transform:scale(.8)}
#pad button.no{opacity:.2}
#pad button.hint{color:var(--acc)}
#pad button.hint svg{animation:padp .7s ease-in-out infinite alternate}
@keyframes padp{to{transform:scale(1.3)}}
.touch #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 242px)}
@media (max-height:500px) and (orientation:landscape){
  #pad{left:auto;margin-left:0;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:144px;height:144px}
  .touch #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 66px)}
}
@media (max-width:600px){
  .lvl .t{font-size:19px}
  .lvl .s{letter-spacing:.14em;font-size:10.5px}
  .ic{width:42px;height:42px}
  #hint{font-size:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 66px)}
  .tr{gap:8px;right:calc(max(18px,env(safe-area-inset-right,0px)) + 50px)}
  #vol .ic{width:42px;height:42px}#volCard{top:52px}
  #solved h3{font-size:50px}
}
@media (max-height:500px){
  #title{padding-top:calc(env(safe-area-inset-top,0px) + 6vh)}.tag{margin:10px 0 18px}#title .menu{margin-bottom:6vh}.logo{font-size:64px}
  #solved h3{font-size:34px}#solved .r{margin:6px 0 14px}
}
@media (prefers-reduced-motion:reduce){.dot.next{animation:none}}
</style>

<div class="bg" id="bgA"></div><div class="bg" id="bgB" style="opacity:0"></div>
<canvas id="gl" aria-label="Flipside puzzle view"></canvas>

  <div class="tl"><button class="ic" id="bMenu" aria-label="Levels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg></button></div>

    <button class="ic" id="bReset" aria-label="Restart (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>

</div>

<div id="title" class="screen on">
  <h1 class="logo">flip<i>side</i></h1>

</div>

</div>

  <div class="top">
    <div class="lab caps" id="sL"></div>

    <div class="nx" id="sN"></div>
    <div class="row">
      <button class="ic" id="bSLevels" aria-label="Levels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg></button>
      <button class="pill" id="bNext">Next<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <button class="ic" id="bReplay" aria-label="Play again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
    </div>
  </div>
</div>
